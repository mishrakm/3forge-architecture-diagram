<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Tables Dashboard</title>
    <style>
        :root {
            --bg: #f7efe4;
            --card: #fffdf8;
            --ink: #2c221a;
            --muted: #6f6052;
            --accent: #0d7f6f;
            --accent-2: #ea6a47;
            --line: #eadcca;
            --shadow: 0 8px 20px rgba(45, 31, 20, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at -10% -10%, #f9c88a55, transparent),
                radial-gradient(1000px 500px at 120% 0%, #8fd6cb55, transparent),
                var(--bg);
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .hero {
            background: linear-gradient(135deg, #1a9c87, #0b6f61);
            color: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: 0.2px;
        }

        .hero p {
            margin: 4px 0;
            opacity: 0.92;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
        .value { font-size: 28px; font-weight: 700; margin-top: 6px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        .chart-title { margin: 0 0 10px; font-size: 16px; }

        .bar-row { display: grid; grid-template-columns: 130px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; }
        .bar-wrap { height: 10px; background: #f3e7d8; border-radius: 999px; overflow: hidden; }
        .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .bar-name { font-size: 13px; color: var(--muted); }
        .bar-num { font-size: 13px; font-weight: 600; text-align: right; }

        .tools {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input, select {
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            padding: 0 10px;
            min-width: 180px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        th, td {
            border-bottom: 1px solid #f2e7d8;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: top;
        }

        th {
            background: #f8f1e8;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tr:hover td { background: #fff8ee; }

        .pill {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: #edf7f5;
            color: #0f6659;
            border: 1px solid #c8e5de;
        }

        .muted { color: var(--muted); font-size: 12px; }

        @media (max-width: 980px) {
            .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .grid { grid-template-columns: 1fr; }
            th, td { font-size: 12px; }
        }
    </style>
</head>
